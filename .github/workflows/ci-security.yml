name: CI — Security & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (fail on secrets)
        run: |
          docker run --rm -v ${{ github.workspace }}:/code zricethezav/gitleaks:latest detect --source /code --exit-code 1

  test-java:
    name: Java CI (gateway)
    runs-on: ubuntu-latest
    needs: [ secret-scan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build & Test (gateway)
        working-directory: ./gateway
        run: |
          mvn -B -DskipTests=false test

  test-python:
    name: Python CI (qr-service)
    runs-on: ubuntu-latest
    needs: [ secret-scan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/qr-service/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./qr-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 bandit pip-audit

      - name: Run tests
        working-directory: ./qr-service
        run: |
          pytest -q

      - name: Lint (flake8)
        working-directory: ./qr-service
        run: |
          flake8 . || true

      - name: Security SAST (Bandit)
        working-directory: ./qr-service
        run: |
          bandit -r . -lll

      - name: Dependency scan (pip-audit)
        working-directory: ./qr-service
        run: |
          pip-audit --progress-spinner

  dependency-scan-java:
    name: Java dependency scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: [ secret-scan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check via Docker (fail on CVSS>=7)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -v ~/.m2:/root/.m2 owasp/dependency-check:latest --project "gateway" --scan /src/gateway --out /src/gateway/dependency-check-report --format ALL --failOnCVSS 7

  build-and-scan:
    name: Build Docker images & scan
    runs-on: ubuntu-latest
    needs: [ test-java, test-python, dependency-scan-java ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        run: |
          docker build -t gateway:${{ github.run_id }} ./gateway

      - name: Build qr-service image
        run: |
          docker build -t qr-service:${{ github.run_id }} ./qr-service

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: ${{ runner.os }}-trivy-

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Scan gateway image with Trivy (HIGH/CRITICAL fail)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL gateway:${{ github.run_id }} || (echo "Trivy found HIGH/CRITICAL vulnerabilities in gateway" && exit 1)

      - name: Scan qr-service image with Trivy (HIGH/CRITICAL fail)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL qr-service:${{ github.run_id }} || (echo "Trivy found HIGH/CRITICAL vulnerabilities in qr-service" && exit 1)

      - name: Generate SBOMs with syft
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/work anchore/syft:latest gateway:${{ github.run_id }} -o json > gateway-sbom.json || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/work anchore/syft:latest qr-service:${{ github.run_id }} -o json > qr-service-sbom.json || true

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            gateway-sbom.json
            qr-service-sbom.json

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    needs: [ secret-scan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v2
